# Build and publish the canonical myNotes application after validated main pushes.
name: myNotes checks and Pages
on:
  pull_request:
    paths: ['myNotes/my_notes_web/**', '.github/workflows/mynotes-pages.yml']
  push:
    branches: [main]
    paths: ['myNotes/my_notes_web/**', '.github/workflows/mynotes-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mynotes-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: myNotes/my_notes_web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: myNotes/my_notes_web/.node-version
          cache: npm
          cache-dependency-path: myNotes/my_notes_web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://ordinantsystem.github.io
          # Keep Pages URLs aligned with the GitHub repository name after renames.
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: myNotes/my_notes_web/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
